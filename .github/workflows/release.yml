name: Release

# Builds unsigned installers and attaches them to a DRAFT GitHub Release.
# No secrets are needed: there is no code signing, notarization or publishing
# anywhere else. Review the draft and publish it by hand.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create/attach to (default: v<package.json version>)'
        required: false
        type: string

permissions:
  contents: read

env:
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  mac:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            appdir: mac-arm64
          - arch: x64
            appdir: mac
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package app (unsigned)
        run: npx electron-builder --mac dir --${{ matrix.arch }} -c.mac.notarize=false -c.mac.identity=null --publish never
      - name: Ad-hoc sign the bundle (avoids the Team ID mismatch crash on first launch)
        run: codesign --force --deep --sign - "dist/${{ matrix.appdir }}/Nightyard.app"
      - name: Build dmg from the signed bundle
        run: npx electron-builder --mac dmg --${{ matrix.arch }} -c.mac.notarize=false -c.mac.identity=null --prepackaged "dist/${{ matrix.appdir }}/Nightyard.app" --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build NSIS installer (unsigned)
        run: npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*.exe
          if-no-files-found: error

  draft-release:
    needs: [mac, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          elif [ -n "${INPUT_TAG}" ]; then
            TAG="${INPUT_TAG}"
          else
            TAG="v$(node -p "require('./package.json').version")"
          fi
          gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "Nightyard $TAG" \
            --notes "Unsigned builds. macOS: drag Nightyard to Applications, then run \`xattr -dr com.apple.quarantine /Applications/Nightyard.app\` once. Windows: SmartScreen will warn about an unknown publisher." \
            artifacts/*/*
